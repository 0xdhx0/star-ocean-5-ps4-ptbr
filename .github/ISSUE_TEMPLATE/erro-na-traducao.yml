name: Erro na tradução
description: Texto cortado, em inglês, erro de português, travamento...
labels: ["erro"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options:
        - Texto cortado ou saindo da caixa
        - Texto ainda em inglês
        - Erro de português ou tradução estranha
        - Imagem com texto em inglês
        - Travamento ou tela preta
        - Problema no instalador
        - Outro
    validations:
      required: true
  - type: dropdown
    id: edicao
    attributes:
      label: Qual das duas versões
      options: ["Nomes Traduzidos (tudo em português)", "Nomes Originais (nomes e imagens do jogo original)"]
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do patch
      placeholder: "v1.0"
    validations:
      required: true
  - type: input
    id: lugar
    attributes:
      label: Onde aconteceu
      description: Cidade, mapa, cena, missão ou menu.
      placeholder: "Sthal, casa do Fidel, depois da fala da Miki"
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: O que aparece e o que deveria aparecer
      description: Copie o texto da tela. Se for erro de português, sugira a correção.
    validations:
      required: true
  - type: textarea
    id: print
    attributes:
      label: Print da tela
      description: Arraste a imagem para cá. Ajuda muito!
  - type: input
    id: emulador
    attributes:
      label: Onde você joga (emulador e versão, ou console)
      placeholder: "ps4rt 0.4.0 / shadPS4 0.x / PS4"
